<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Depot — Latitude Signpack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --asphalt:#1a1a1a;
    --asphalt-2:#232323;
    --asphalt-3:#2b2b2b;
    --line:#3a3a3a;
    --yellow:#e03333;
    --yellow-dim:#7a2020;
    --red:#e03333;
    --cyan:#1fcccc;
    --white:#f5f5f5;
    --grey:#9a9a9a;
    --grey-dim:#5f5f5f;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px) 0 0/44px 44px,
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px) 0 0/44px 44px,
      var(--asphalt);
    color:var(--white);
    font-family:'Geist',sans-serif;
    min-height:100vh;
  }
  ::selection{background:var(--red);color:#fff;}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:var(--asphalt);
    border-bottom:2px solid var(--red);
    box-shadow:0 4px 18px rgba(0,0,0,0.45);
    padding:14px 20px 12px;
  }
  .header-row{
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  }
  .brand{
    display:flex;align-items:center;gap:14px;
    margin-right:auto;
  }
  .brand-logo{
    height:26px;width:auto;
    flex-shrink:0;
    display:block;
  }
  .brand-divider{
    width:1px;height:26px;background:var(--line);flex-shrink:0;
  }
  .brand p{
    margin:0;color:var(--grey);font-size:11px;
    font-family:'Geist Mono',monospace;letter-spacing:0.6px;
    text-transform:uppercase;
    line-height:1.5;
  }
  .brand p b{color:var(--red);font-weight:600;}

  .search-wrap{
    position:relative;flex:1 1 240px;max-width:340px;
  }
  .search-wrap input{
    width:100%;
    background:var(--asphalt-2);
    border:1.5px solid var(--line);
    color:var(--white);
    padding:9px 14px 9px 34px;
    border-radius:5px;
    font-family:'Geist Mono',monospace;
    font-size:13px;
    outline:none;
    transition:border-color .15s;
  }
  .search-wrap input:focus{border-color:var(--yellow);}
  .search-wrap svg{
    position:absolute;left:11px;top:50%;transform:translateY(-50%);
    width:14px;height:14px;stroke:var(--grey);
  }
  .search-wrap .clear-btn{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--grey);cursor:pointer;
    font-size:16px;line-height:1;display:none;padding:2px 4px;
  }
  .search-wrap .clear-btn:hover{color:var(--white);}

  .bg-filter-row{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    width:100%;
    padding-top:10px;
    margin-top:2px;
    border-top:1px solid var(--asphalt-3);
  }
  .bg-filter-label{
    font-family:'Geist Mono',monospace;font-size:11px;
    color:var(--grey-dim);text-transform:uppercase;letter-spacing:0.5px;
    flex-shrink:0;
    margin-right:2px;
  }
  .filter-pills{display:flex;gap:6px;flex-wrap:wrap;}
  .pill{
    background:var(--asphalt-2);
    border:1.5px solid var(--line);
    color:var(--grey);
    padding:6px 12px;
    border-radius:99px;
    font-family:'Geist Mono',monospace;
    font-size:11px;
    font-weight:500;
    letter-spacing:0.3px;
    cursor:pointer;
    text-transform:uppercase;
    transition:all .15s;
    user-select:none;
    white-space:nowrap;
    display:flex;align-items:center;gap:6px;
  }
  .pill .swatch{
    width:9px;height:9px;border-radius:50%;
    border:1px solid rgba(255,255,255,0.25);
    flex-shrink:0;
  }
  .pill:hover{border-color:var(--grey-dim);color:var(--white);}
  .pill.active{
    background:var(--red);
    border-color:var(--red);
    color:#fff;
    font-weight:700;
  }
  .stats{
    font-family:'Geist Mono',monospace;
    font-size:11.5px;color:var(--grey-dim);
    white-space:nowrap;
    margin-left:auto;
    display:flex;align-items:center;gap:6px;
    text-transform:uppercase;letter-spacing:0.5px;
  }
  .pulse-dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--red);
    flex-shrink:0;
    animation:pulse-anim 1.8s ease-in-out infinite;
  }
  @keyframes pulse-anim{
    0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(224,51,51,0.5);}
    50%{opacity:0.6;box-shadow:0 0 0 4px rgba(224,51,51,0);}
  }

  /* ---------- Board ---------- */
  .board{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
    gap:16px;
    padding:20px;
    align-items:start;
  }
  .column{
    background:var(--asphalt-2);
    border:1px solid var(--line);
    border-radius:8px;
    display:flex;
    flex-direction:column;
    max-height:calc(100vh - 150px);
    overflow:hidden;
    min-width:0;
  }
  .column.hidden{display:none;}
  .column-stack{
    display:flex;
    flex-direction:column;
    gap:16px;
    min-width:0;
  }
  .column-stack .column-stacked{
    max-height:calc((100vh - 166px) / 2);
  }
  .column-stack .column-stacked.hidden{display:none;}
  .column-stack .column-stacked .column-head{padding:9px 12px 8px;}
  .column-stack .column-stacked .column-head h2{font-size:12.5px;}
  .column-stack .column-stacked .column-body{padding:9px;gap:8px;}
  .column-head{
    padding:12px 14px 10px;
    border-bottom:2px solid var(--asphalt-3);
    display:flex;align-items:baseline;justify-content:space-between;
    gap:8px;
    background:var(--asphalt-2);
    position:relative;
  }
  .column-head::before{
    content:"";
    position:absolute;left:0;top:0;bottom:0;width:4px;
    background:var(--col-accent, var(--yellow));
  }
  .column-head h2{
    margin:0;font-size:14px;font-weight:700;text-transform:uppercase;
    letter-spacing:0.4px;
    display:flex;align-items:center;gap:7px;
    min-width:0;
  }
  .column-head h2 .htext{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .column-count{
    font-family:'Geist Mono',monospace;
    font-size:11px;color:var(--grey);
    background:var(--asphalt);
    padding:2px 7px;border-radius:99px;
    flex-shrink:0;
  }
  .column-body{
    overflow-y:auto;
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  /* ---------- Checkpoint combo card (3 colors sliced into 1 card) ---------- */
  .sign-card.cp-combo{cursor:default;}
  .sign-card.cp-combo:hover{transform:none;box-shadow:none;border-color:var(--line);}
  .cp-rows{
    display:flex;flex-direction:row;
    aspect-ratio:6/1;
    border-radius:4px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .cp-slice{
    position:relative;cursor:pointer;overflow:hidden;
    transition:filter .12s;
    height:100%;
    background:#08090a;
    flex:1 1 0;
    min-width:0;
  }
  .cp-slice:not(:last-child){border-right:1px solid rgba(0,0,0,0.5);}
  .cp-slice:hover{filter:brightness(1.15);}
  .cp-rows .cp-slice img{
    position:absolute;top:0;
    width:300%;height:100%;max-width:none;
    max-height:none;
    display:block;
    border-radius:0;
    pointer-events:none;
  }
  .cp-rows .cp-slice .slice-tag{
    position:absolute;bottom:2px;right:4px;
    font-family:'Geist Mono',monospace;font-size:8px;
    color:rgba(255,255,255,0.6);text-transform:uppercase;letter-spacing:0.4px;
    text-shadow:0 1px 2px rgba(0,0,0,0.8);pointer-events:none;
  }
  .cp-rows .cp-slice .no-preview{position:absolute;inset:0;aspect-ratio:auto;font-size:8px;}
  .cp-rows .cp-slice .copied-flash{font-size:10px;gap:4px;}
  .cp-rows .cp-slice .copied-flash svg{width:12px;height:12px;}
  .cp-rows .cp-slice.copied .copied-flash{opacity:1;}

  /* ---------- Shared portal tooltip (avoids column overflow clipping) ---------- */
  .danger-btn{
    flex-shrink:0;
    width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;
    cursor:default;
  }
  .danger-btn svg{width:16px;height:16px;stroke:var(--red);fill:none;stroke-width:2;}
  #sharedTooltip{
    position:fixed;
    z-index:200;
    width:230px;
    background:#0e0f11;
    border:1.5px solid var(--red);
    border-radius:6px;
    padding:10px 12px;
    font-family:'Geist Mono',monospace;
    font-size:11px;
    line-height:1.5;
    color:var(--white);
    box-shadow:0 8px 20px rgba(0,0,0,0.55);
    display:none;
    text-transform:none;
    letter-spacing:0;
    font-weight:400;
    pointer-events:none;
  }
  #sharedTooltip.open{display:block;}
  #sharedTooltip b{color:var(--red);}

  /* ---------- Sign card ---------- */
  .sign-card{
    position:relative;
    background:#0e0f11;
    border:1.5px solid var(--line);
    border-radius:5px;
    padding:8px 8px 7px;
    cursor:pointer;
    transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .sign-card:hover{
    border-color:var(--yellow-dim);
    transform:translateY(-2px);
    box-shadow:0 6px 14px rgba(0,0,0,0.4);
  }
  .sign-card:active{transform:translateY(0px) scale(0.98);}
  .sign-card img, .sign-card video{
    display:block;width:100%;height:auto;
    border-radius:3px;
    background:#08090a;
    pointer-events:none;
  }
  .sign-card .no-preview{
    display:none;
    width:100%;
    aspect-ratio:2/1;
    border-radius:3px;
    background:repeating-linear-gradient(45deg,#1c1e21,#1c1e21 6px,#151719 6px,#151719 12px);
    border:1px dashed var(--line);
    align-items:center;justify-content:center;
    text-align:center;
    padding:6px;
    font-family:'Geist Mono',monospace;
    font-size:9.5px;
    color:var(--grey-dim);
    pointer-events:none;
  }
  .sign-card img.broken{display:none;}
  .sign-card img.broken + .no-preview{display:flex;}
  .sign-card .cp-label{
    margin-top:6px;
    font-family:'Geist Mono',monospace;
    font-size:10.5px;
    color:var(--grey);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    pointer-events:none;
  }
  .sign-card .overlay-filename{
    margin-top:6px;
    font-family:'Geist Mono',monospace;
    font-size:10.5px;
    color:var(--grey);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    pointer-events:none;
  }
  .sign-card .guide-caption{
    margin-top:6px;
    font-family:'Geist Mono',monospace;
    font-size:11px;
    font-weight:600;
    color:var(--yellow);
    text-transform:uppercase;
    letter-spacing:0.4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    pointer-events:none;
  }
  .sign-card.guide-card{cursor:default;}
  .sign-card.guide-card:hover{transform:none;box-shadow:none;border-color:var(--line);}

  .sign-card .copied-flash{
    position:absolute;inset:0;
    background:rgba(31,204,204,0.95);
    border-radius:5px;
    display:flex;align-items:center;justify-content:center;
    gap:6px;
    color:#102626;font-weight:700;font-family:'Geist Mono',monospace;
    font-size:12px;text-transform:uppercase;letter-spacing:0.5px;
    opacity:0;pointer-events:none;
    transition:opacity .12s ease;
  }
  .sign-card.copied .copied-flash{opacity:1;}
  .sign-card .copied-flash svg{width:15px;height:15px;stroke:#102626;stroke-width:3;}

  .column-body::-webkit-scrollbar{width:9px;}
  .column-body::-webkit-scrollbar-track{background:var(--asphalt);}
  .column-body::-webkit-scrollbar-thumb{background:var(--asphalt-3);border-radius:99px;}
  .column-body::-webkit-scrollbar-thumb:hover{background:var(--grey-dim);}

  .empty-state{
    width:100%;text-align:center;color:var(--grey-dim);
    font-family:'Geist Mono',monospace;font-size:13px;
    padding:80px 20px;
  }

  @media (max-width:640px){
    .brand h1{font-size:18px;}
    .header-row{gap:10px;}
    .board{padding:14px;gap:12px;}
  }
</style>
</head>

<script>
const MANIFEST = JSON.parse(document.getElementById('manifest-data').textContent);

const CATEGORY_ORDER = [
  "Names (2x1)",
  "Names (4x1)",
  "Utility (2x1)",
  "Utility (4x1)",
  "6x1",
  "Branding — Overlays",
  "Branding — Backgrounds",
  "Moving Backgrounds",
  "Scaffolding",
  "LSM"
];

const CATEGORY_ACCENT = {
  "Names (2x1)": "#e03333",
  "Names (4x1)": "#e03333",
  "Utility (2x1)": "#e03333",
  "Utility (4x1)": "#e03333",
  "6x1": "#e03333",
  "Branding — Overlays": "#e03333",
  "Branding — Backgrounds": "#e03333",
  "Scaffolding": "#e03333",
  "Moving Backgrounds": "#e03333",
  "LSM": "#e03333"
};

// categories that ARE backgrounds themselves (vs. overlays that sit on top of a background)
const BACKGROUND_CATEGORIES = new Set([
  "Branding — Backgrounds",
  "Scaffolding",
  "Moving Backgrounds"
]);

// background color -> which overlay variant is allowed on it, per brand guidelines
const BG_RULES = {
  black:  "white_red",
  white:  "black_red",
  blue:   "white",
  green:  "white",
  purple: "white",
  red:    "white",
  cyan:   "black",
  lime:   "black",
  orange: "black",
  pink:   "black",
  yellow: "black"
};

const BG_COLORS = [
  { key: "all",    label: "All",    swatch: null },
  { key: "black",  label: "Black",  swatch: "#111214" },
  { key: "white",  label: "White",  swatch: "#f2f2f2" },
  { key: "blue",   label: "Blue",   swatch: "#225ea0" },
  { key: "green",  label: "Green",  swatch: "#2e5b2f" },
  { key: "purple", label: "Purple", swatch: "#59376d" },
  { key: "red",    label: "Red",    swatch: "#e03333" },
  { key: "cyan",   label: "Cyan",   swatch: "#00c6c6" },
  { key: "lime",   label: "Lime",   swatch: "#aace27" },
  { key: "orange", label: "Orange", swatch: "#ff8d27" },
  { key: "pink",   label: "Pink",   swatch: "#f92daf" },
  { key: "yellow", label: "Yellow", swatch: "#ffde00" }
];

function colorTagOf(name) {
  const n = name.toLowerCase();
  if (n.includes('black_red')) return 'black_red';
  if (n.includes('white_red')) return 'white_red';
  if (n.includes('black')) return 'black';
  if (n.includes('white')) return 'white';
  if (n.includes('red')) return 'red';
  return 'other';
}

function bgColorOf(name) {
  const n = name.toLowerCase();
  // brand moving-background naming: dark==black, light==white
  if (n.includes('brand-dark') || n.includes('dark')) return 'black';
  if (n.includes('brand-light') || n.includes('light')) return 'white';
  const words = ["black","white","blue","green","purple","red","cyan","lime","orange","pink","yellow"];
  for (const w of words) {
    if (n.includes(w)) return w;
  }
  return null;
}

// strip the leading size/type token so sorting reflects what comes after it
function sortKeyOf(name) {
  return name
    .toLowerCase()
    .replace(/^\d+x\d+[-_]/, '')
    .replace(/^cp_/, '')
    .replace(/\.(png|jpe?g|webm)$/, '');
}

// group by category
const byCategory = {};
for (const item of MANIFEST) {
  if (!byCategory[item.category]) byCategory[item.category] = [];
  item.colorTag = colorTagOf(item.name);
  item.bgColor = bgColorOf(item.name);
  byCategory[item.category].push(item);
}
for (const cat in byCategory) {
  byCategory[cat].sort((a, b) => {
    if (a.type === 'guide' && b.type !== 'guide') return -1;
    if (b.type === 'guide' && a.type !== 'guide') return 1;
    return sortKeyOf(a.name).localeCompare(sortKeyOf(b.name), undefined, { numeric: true, sensitivity: 'base' });
  });
}

// 6x1 column: collapse cp_XX_black/white/red (and the 6x1_branding_ trio) into one combo
// card per group, sorted numerically (so cp_100 correctly lands after cp_99, not before
// cp_11), with 6x1_branding landing after all numbers and cp_finish sorting last of all.
function groupCheckpointItems(items) {
  const groups = {};
  const order = [];
  const reCp = /^cp_(\d+|finish)_(black|white|red)\.(jpe?g|png)$/i;
  const reBrand = /^(6x1_branding)_(black|white|red)\.(jpe?g|png)$/i;
  for (const item of items) {
    let m = item.name.match(reCp);
    let key, label;
    if (m) {
      key = m[1].toLowerCase();
      label = key === 'finish' ? 'cp_finish' : 'cp_' + key;
    } else {
      m = item.name.match(reBrand);
      if (m) {
        key = m[1].toLowerCase();
        label = key;
      }
    }
    if (!m) {
      const singleKey = '__single__' + item.name;
      groups[singleKey] = { key: singleKey, label: item.name, colors: {}, singleItem: item };
      order.push(singleKey);
      continue;
    }
    const color = m[2].toLowerCase();
    if (!groups[key]) { groups[key] = { key, label, colors: {} }; order.push(key); }
    groups[key].colors[color] = item;
  }
  const rankOf = (key) => {
    if (key === '6x1_branding') return -2;
    if (key === 'finish') return -1;
    if (/^\d+$/.test(key)) return parseInt(key, 10);
    return Infinity;
  };
  order.sort((a, b) => rankOf(a) - rankOf(b));
  return order.map(k => groups[k]);
}

const board = document.getElementById('board');
const searchInput = document.getElementById('searchInput');
const clearSearch = document.getElementById('clearSearch');
const statsLine = document.getElementById('statsLine');
const bgPillsWrap = document.getElementById('bgPills');

let activeBg = 'all';
let activeQuery = '';

function buildBgPills() {
  bgPillsWrap.innerHTML = '';
  for (const c of BG_COLORS) {
    const pill = document.createElement('div');
    pill.className = 'pill' + (c.key === 'all' ? ' active' : '');
    pill.dataset.bg = c.key;
    pill.innerHTML = (c.swatch ? `<span class="swatch" style="background:${c.swatch}"></span>` : '') + c.label;
    pill.addEventListener('click', () => {
      bgPillsWrap.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      activeBg = c.key;
      applyFilters();
    });
    bgPillsWrap.appendChild(pill);
  }
}

const DANGER_TEXT = "Only use on for fun projects, DO NOT use on comp/totd maps since they will cause performance issues for some players.";

// single shared tooltip, portal'd to <body> so column overflow never clips it
const sharedTooltip = document.createElement('div');
sharedTooltip.id = 'sharedTooltip';
sharedTooltip.innerHTML = `<b>Heads up —</b> ${DANGER_TEXT}`;
document.body.appendChild(sharedTooltip);

function showTooltipNear(el) {
  const r = el.getBoundingClientRect();
  sharedTooltip.classList.add('open');
  const ttWidth = 230;
  let left = r.left;
  if (left + ttWidth > window.innerWidth - 12) left = window.innerWidth - ttWidth - 12;
  sharedTooltip.style.left = left + 'px';
  sharedTooltip.style.top = (r.bottom + 8) + 'px';
}
function hideTooltip() {
  sharedTooltip.classList.remove('open');
}

function renderCpCombo(group) {
  const card = document.createElement('div');
  card.className = 'sign-card cp-combo';
  card.dataset.name = group.label.toLowerCase();

  const rows = document.createElement('div');
  rows.className = 'cp-rows';
  // left-to-right: black slice shows the logo-side third, red shows the number-side
  // third, white shows the tail third — reconstructed as one continuous-looking banner.
  const order = ['black', 'red', 'white'];
  order.forEach((color, idx) => {
    const item = group.colors[color];
    if (!item) return;
    const slice = document.createElement('div');
    slice.className = 'cp-slice';
    slice.dataset.name = item.name.toLowerCase();
    slice.dataset.colorTag = colorTagOf(item.name);
    slice.innerHTML = `
      <img src="${item.url}" alt="${item.name}" loading="lazy" style="left:-${idx * 100}%" onerror="this.classList.add('broken')">
      <div class="no-preview">no preview</div>
      <span class="slice-tag">${color}</span>
      <div class="copied-flash">
        <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        ${color}
      </div>
    `;
    slice.addEventListener('click', () => copySign(slice, item));
    rows.appendChild(slice);
  });
  card.appendChild(rows);

  const label = document.createElement('div');
  label.className = 'cp-label';
  label.textContent = group.label;
  card.appendChild(label);

  return card;
}

function buildBoard() {
  board.innerHTML = '';
  const cats = CATEGORY_ORDER.filter(c => byCategory[c]);
  for (const cat of Object.keys(byCategory)) {
    if (!cats.includes(cat)) cats.push(cat);
  }

  for (const cat of cats) {
    const items = byCategory[cat];
    const col = document.createElement('div');
    col.className = 'column';
    col.dataset.category = cat;
    col.style.setProperty('--col-accent', CATEGORY_ACCENT[cat] || '#e03333');

    const head = document.createElement('div');
    head.className = 'column-head';
    const h2 = document.createElement('h2');
    h2.innerHTML = `<span class="htext">${cat}</span>`;

    if (cat === 'Moving Backgrounds') {
      const danger = document.createElement('div');
      danger.className = 'danger-btn';
      danger.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 3 1 21h22L12 3z" stroke-linejoin="round"/><line x1="12" y1="9" x2="12" y2="14"/><circle cx="12" cy="17" r="0.8" fill="var(--red)" stroke="none"/></svg>`;
      danger.addEventListener('mouseenter', () => showTooltipNear(danger));
      danger.addEventListener('mouseleave', hideTooltip);
      h2.appendChild(danger);
    }

    head.appendChild(h2);
    const countEl = document.createElement('span');
    countEl.className = 'column-count';
    const comboGroups = cat === '6x1' ? groupCheckpointItems(items) : null;
    countEl.textContent = comboGroups ? comboGroups.length : items.length;
    head.appendChild(countEl);
    col.appendChild(head);

    const body = document.createElement('div');
    body.className = 'column-body';

    if (comboGroups) {
      for (const group of comboGroups) {
        if (group.singleItem) {
          const item = group.singleItem;
          const card = document.createElement('div');
          card.className = 'sign-card';
          card.dataset.name = item.name.toLowerCase();
          card.dataset.colorTag = colorTagOf(item.name);
          card.innerHTML = `
            <img src="${item.url}" alt="${item.name}" loading="lazy" onerror="this.classList.add('broken')">
            <div class="no-preview">no preview<br>(click still copies URL)</div>
            <div class="copied-flash">
              <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              Copied
            </div>`;
          card.addEventListener('click', () => copySign(card, item));
          body.appendChild(card);
        } else {
          body.appendChild(renderCpCombo(group));
        }
      }
    } else {
      for (const item of items) {
        const card = document.createElement('div');
        const isGuide = item.type === 'guide';
        card.className = 'sign-card' + (isGuide ? ' guide-card' : '');
        card.dataset.name = item.name.toLowerCase();
        card.dataset.colorTag = item.colorTag;
        card.dataset.bgColor = item.bgColor || '';
        card.dataset.category = cat;
        card.dataset.type = item.type || 'image';

        let mediaHtml;
        if (item.type === 'video') {
          mediaHtml = `<video src="${item.url}" muted loop autoplay playsinline preload="metadata"></video>`;
        } else {
          mediaHtml = `<img src="${item.url}" alt="${item.name}" loading="lazy" onerror="this.classList.add('broken')">
            <div class="no-preview">no preview${isGuide ? '' : '<br>(click still copies URL)'}</div>`;
        }

        if (isGuide) {
          card.innerHTML = `
            ${mediaHtml}
            <div class="guide-caption">Only for these</div>
          `;
          // guide image is reference only — intentionally no click / copy behavior
        } else {
          const showFilename = cat === 'Branding — Overlays';
          card.innerHTML = `
            ${mediaHtml}
            ${showFilename ? `<div class="overlay-filename">${item.name}</div>` : ''}
            <div class="copied-flash">
              <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              Copied
            </div>
          `;
          card.addEventListener('click', () => copySign(card, item));
        }
        body.appendChild(card);
      }
    }

    col.appendChild(body);

    const STACKED = new Set(['Scaffolding', 'LSM']);
    if (STACKED.has(cat)) {
      col.classList.add('column-stacked');
      let stack = board.querySelector('.column-stack');
      if (!stack) {
        stack = document.createElement('div');
        stack.className = 'column-stack';
        board.appendChild(stack);
      }
      stack.appendChild(col);
    } else {
      board.appendChild(col);
    }
  }
}

function copySign(card, item) {
  const finish = () => {
    card.classList.add('copied');
    setTimeout(() => card.classList.remove('copied'), 1100);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(item.url).then(finish).catch(() => fallbackCopy(item.url, finish));
  } else {
    fallbackCopy(item.url, finish);
  }
}

function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  cb();
}

function applyFilters() {
  const q = activeQuery.trim().toLowerCase();
  const requiredOverlayTag = activeBg !== 'all' ? BG_RULES[activeBg] : null;
  let visibleCount = 0;

  document.querySelectorAll('.column').forEach(col => {
    const cat = col.dataset.category;
    const isBgCategory = BACKGROUND_CATEGORIES.has(cat);
    let anyVisible = false;
    const cards = col.querySelectorAll('.sign-card');

    cards.forEach(card => {
      if (card.classList.contains('cp-combo')) {
        let cardAnyVisible = false;
        card.querySelectorAll('.cp-slice').forEach(slice => {
          const nameMatch = q === '' || slice.dataset.name.includes(q) || card.dataset.name.includes(q);
          let bgMatch = true;
          if (activeBg !== 'all') {
            const tag = slice.dataset.colorTag;
            if (tag === 'black' || tag === 'white' || tag === 'black_red' || tag === 'white_red') {
              bgMatch = tag === requiredOverlayTag;
            } else {
              bgMatch = true;
            }
          }
          const show = nameMatch && bgMatch;
          slice.style.visibility = show ? '' : 'hidden';
          if (show) { cardAnyVisible = true; visibleCount++; }
        });
        card.style.display = cardAnyVisible ? '' : 'none';
        if (cardAnyVisible) anyVisible = true;
        return;
      }

      const nameMatch = q === '' || card.dataset.name.includes(q);
      let bgMatch = true;

      if (activeBg !== 'all' && card.dataset.type !== 'guide') {
        if (isBgCategory) {
          bgMatch = card.dataset.bgColor === activeBg;
        } else {
          const tag = card.dataset.colorTag;
          if (tag === 'black' || tag === 'white' || tag === 'black_red' || tag === 'white_red') {
            bgMatch = tag === requiredOverlayTag;
          } else {
            bgMatch = true; // unclear/other variants: don't hide, rule doesn't define them
          }
        }
      }

      const show = nameMatch && bgMatch;
      card.style.display = show ? '' : 'none';
      if (show) { anyVisible = true; visibleCount++; }
    });

    col.classList.toggle('hidden', !anyVisible);
  });

  document.querySelectorAll('.column-stack').forEach(stack => {
    const anyChildVisible = [...stack.children].some(c => !c.classList.contains('hidden'));
    stack.style.display = anyChildVisible ? '' : 'none';
  });

  statsLine.innerHTML = `<span class="pulse-dot"></span>${visibleCount} item${visibleCount === 1 ? '' : 's'}`;
  clearSearch.style.display = activeQuery ? 'block' : 'none';
}

searchInput.addEventListener('input', (e) => {
  activeQuery = e.target.value;
  applyFilters();
});
clearSearch.addEventListener('click', () => {
  searchInput.value = '';
  activeQuery = '';
  applyFilters();
  searchInput.focus();
});

buildBgPills();
buildBoard();
applyFilters();
</script>
